$font = Red Hat Display
$icons = JetBrainsMono Nerd Font

general {
    hide_cursor = false
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 2, linear
    animation = fadeOut, 1, 2, linear
}

background {
    monitor =
    path = /home/raj/.cache/hyprlock-bg.jpg
    color = rgba(0, 0, 0, 1.0)
    blur_passes = 0
}

shape {
    monitor =
    size = 100%, 100%
    color = rgba(0, 0, 0, 0.30)
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = -1
}

label {
    monitor =
    text = cmd[update:1000] echo "<span font_weight='900'>$(date +%H:%M)</span>"
    color = rgba(255, 255, 255, 1.0)
    font_size = 70
    font_family = $font
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.55)
    position = 0, -40
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] echo "<span font_weight='600'>$(LC_TIME=en_US.UTF-8 date '+%A, %B %d, %Y')</span>"
    color = rgba(255, 255, 255, 1.0)
    font_size = 14
    font_family = $font
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.55)
    position = 0, -150
    halign = center
    valign = top
}

image {
    monitor =
    path=$HOME/.avatar
    size = 120
    rounding = -1
    border_size = 0
    position = 0, 45
    halign = center
    valign = center
}

label {
    monitor =
    text = <span font_weight='700'>$USER</span>
    color = rgba(255, 255, 255, 1.0)
    font_size = 16
    font_family = $font
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.55)
    position = 0, -38
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 200, 30
    outline_thickness = 0
    rounding = 10
    inner_color = rgba(255, 255, 255, 0.15)
    outer_color = rgba(0, 0, 0, 0)
    check_color = rgba(255, 255, 255, 0.30)
    fail_color = rgba(255, 255, 255, 0.15)
    font_color = rgba(255, 255, 255, 1.0)
    font_family = $font
    placeholder_text = <span font_size='9pt' fgalpha='70%'>Password</span>
    fail_text = <span font_size='9pt'>$FAIL</span>
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    fade_on_empty = false
    hide_input = false
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    position = -22, -75
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰌾
    color = rgba(255, 255, 255, 1.0)
    font_size = 11
    font_family = $icons
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.55)
    position = -103, -75
    halign = center
    valign = center
}

shape {
    monitor =
    size = 30, 30
    color = rgba(255, 255, 255, 0.15)
    rounding = 10
    border_size = 0
    position = 103, -75
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰁔
    color = rgba(255, 255, 255, 1.0)
    font_size = 13
    font_family = $icons
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.55)
    position = 103, -75
    halign = center
    valign = center
}

label {
    monitor =
    text = <span font_family='$icons' size='12pt'></span>   <span font_weight='400'>Hyprland</span>
    color = rgba(255, 255, 255, 1.0)
    font_size = 10
    font_family = $font
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.55)
    position = 50, 50
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:5000] echo "<span font_family='$icons' size='11pt'>󰗊</span>   $(hyprctl getoption input:kb_layout -j 2>/dev/null | jq -r '.str // "us"' | cut -d, -f1)"
    color = rgba(255, 255, 255, 1.0)
    font_size = 10
    font_family = $font
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.55)
    position = -130, 55
    halign = right
    valign = bottom
}

label {
    monitor =
    text = 󰌓
    color = rgba(255, 255, 255, 1.0)
    font_size = 16
    font_family = $icons
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.55)
    position = -90, 53
    halign = right
    valign = bottom
}

label {
    monitor =
    text = 󰐥
    color = rgba(255, 255, 255, 1.0)
    font_size = 13
    font_family = $icons
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.55)
    position = -50, 53
    halign = right
    valign = bottom
}
