###################
### VARIABLES   ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$filemanager = yazi 
$filemanager_naut = dolphin --new-window
$menu = rofi -show 
$browserdefault = firefox # yay -S zen-browser-bin
$hyprlock = hyprlock
$reload_quickshell = qs -p $HOME/.config/quickshell kill; sleep 1; qs -p $HOME/.config/quickshell -n -d
$wallpapers = sh $HOME/scripts/select_wallpaper.sh
$border_color = rgba(255,255,255,0.1)
